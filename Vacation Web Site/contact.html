    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Palm Tree Travel: Home</title>
</head>

<body>
    <!-- #start the page head -->
    <header>
      <img src="images/palmtreeslogo.png" alt="logo for Palm Tree Travel" height="50" width="50">
         <span>Palm Tree Travel</span>
    </header>

    <!-- #start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="order.html">Vacation Packages</a></li>
            <li><a href="packing.html">Packing</a></li>
            <li class="active"><a href="contact.html">Contact Us</a></li>
    


        </ul>



    </nav>

    <!-- #start the main content -->
    <main>
        <form method="get" class="myForm" action="thanks.html">

            <fieldset>
                <legend>Customer Information</legend>
                <label>First Name*<input type="text" name="fname" required></label>
                <label>Last Name*<input type="text" name="lname" required></label>
                <label>Cell Number*<input type="tel" name="phone" required placeholder="800-800-8000"></label>
                <label>Email*<input type="email" name="email" required></label>
            </fieldset>

            <fieldset>
                <legend>Vacation Package</legend>
                <label><input type="radio" name="loyalty" value="Oahu, Hawaii"> Oahu, Hawaii</label>
                <label><input type="radio" name="loyalty" value="Santorini, Greece"> Santorini, Greece</label>
                <label><input type="radio" name="loyalty" value="Tuscany, Italy"> Tuscany, Italy</label>
            </fieldset>

            <fieldset>

                <label>Number of Guests
                <select name="size">
                <option value="none">Please Select</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                </select>
                </label>
            </fieldset>

            <label> Where should our next package be?
<textarea name="special requests"></textarea>

            </label>




            <input type="submit" value="Place an Order">
        </form>




    </main>
